# The local Kubernetes cluster for this lab: one node, which is a Docker container.
# Create it with:  kind create cluster --config infra/labs/kind/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    # The node image decides the Kubernetes version. Pinned by digest like every other
    # image. This digest is the one listed in the kind v0.33.0 release notes.
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
