# Web server settings for the "static" image (Kubernetes lab and local checks only).
# In AWS, CloudFront and S3 do this job, and CloudFront adds the security headers (B3).

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Do not tell visitors which nginx version this is.
    server_tokens off;

    # The same basic headers CloudFront will send (SR-60). Kept short here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # A single-page app: the browser asks for /todos, but only index.html exists.
    # Serve the real file if there is one, otherwise index.html, and React Router
    # shows the right page.
    location / {
        try_files $uri /index.html;
    }

    # Built files have a hash in their name, so they can be cached for a long time.
    # `expires` is used, not `add_header Cache-Control`: in nginx, one add_header inside
    # a location block silently drops every add_header from the server block above, so
    # these files would lose the security headers.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
}
