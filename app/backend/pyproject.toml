# The backend's packages and tool settings.
# Packages are managed with uv. Change versions here, then run `make lock`.
# Every version is exact (SR-80). uv.lock adds a hash for every file.

[project]
name = "productivity-app-backend"
version = "0.1.0"
description = "FastAPI backend of the productivity app"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.2",
    "boto3==1.43.125",
    # Checks the sign-in tokens (B4-02, ADR-0003). The crypto extra adds RS256 support.
    "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    # The HTTP client behind FastAPI's TestClient (successor of httpx, same author).
    "httpx2==2.16.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "boto3-stubs[dynamodb]==1.43.125",
    "pip-audit==2.10.1",
    "watchfiles==1.3.0",
]

[tool.uv]
# This is an app, not a library: it is not installed as a package. The code is found
# through PYTHONPATH=/app/src.
package = false
# A cooldown: when the lockfile is made, uv ignores anything published in the last
# 14 days. It enforces the "at least two weeks old" rule in docs/dependency-policy.md, also
# for the packages that our packages pull in. Most malicious releases are found and
# removed within days.
exclude-newer = "14 days"

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --strict-markers"
markers = [
    "integration: needs DynamoDB Local (started by Docker Compose)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E, W: style. F: real mistakes (unused names, undefined names). I: import order.
# B: likely bugs. UP: old syntax. S: security (bandit rules). C4, SIM: simpler code.
# T20: no print(). PT: pytest style. RUF: ruff's own.
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "T20", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works.
"tests/**" = ["S101"]
# Scripts talk to a person in a terminal.
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:scripts"
files = ["src", "tests", "scripts"]
explicit_package_bases = true
