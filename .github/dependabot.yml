# Dependabot opens a pull request when a pinned dependency has a newer version.
# Its pull requests pass through the same CI checks as ours.
#
# Only GitHub Actions for now. Docker, pip and npm are added in bolt B2, when the
# Dockerfiles and lockfiles exist (Dependabot reports an error for a folder with
# nothing to update).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it. Most malicious releases are
    # found and removed within days.
    cooldown:
      default-days: 7
