# Dependabot opens a pull request when a pinned dependency has a newer version.
# Its pull requests pass through the same CI checks as ours.
#
# cooldown: wait a week after a release before proposing it. Most malicious releases
# are found and removed within days.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Base images in the backend Dockerfile (Python, uv).
  - package-ecosystem: docker
    directory: /app/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on Python 3.12 (owner's decision, B2). Patch updates and rebuilt images
      # of 3.12 are still proposed; 3.13 and later are not.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Images in compose.yaml (DynamoDB Local).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Python packages in pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /app/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Base images in the frontend Dockerfile (Node, nginx).
  - package-ecosystem: docker
    directory: /app/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on Node 26, the current LTS line. A new major version is a decision,
      # not an automatic update.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # npm packages in package.json and package-lock.json.
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 is not accepted by typescript-eslint yet (B2 build notes).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
